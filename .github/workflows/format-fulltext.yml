name: Format fulltext search changes
on:
  push:
    paths:
      - .github/workflows/format-fulltext.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/menu/fulltext_search.ts src/menu/fulltext_search.spec.ts src/menu/search.tsx src/menu/top_bar.tsx src/menu/use_search.tsx src/pages/view_page.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src
            git commit -m "Format local fulltext search implementation"
            git push origin HEAD:master
          fi

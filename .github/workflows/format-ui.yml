name: Format UI branch

on:
  push:
    branches:
      - feature/ui-improvements
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui-improvements
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier style to changed UI files
        run: |
          npx prettier --write src/chart/chart_types.ts src/chart/chart_wrapper.ts src/hooks/use_url_state.ts src/index.tsx src/pages/view_page.tsx src/sidepanel/config/config.tsx src/sidepanel/details/details.tsx src/sidepanel/details/events.tsx src/sidepanel/details/event-extras.tsx src/sidepanel/details/safe-note-html.tsx src/util/language.ts
      - name: Commit formatting if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src
            git commit -m "Apply Prettier formatting to UI improvements"
            git push origin HEAD:feature/ui-improvements
          fi

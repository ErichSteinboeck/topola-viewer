name: Format URL import changes
on:
  push:
    paths:
      - .github/workflows/format-url-import.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/datasource/load_data.ts src/datasource/load_data.spec.ts src/util/url_args.ts src/util/url_args.spec.ts src/menu/url_menu.tsx DEVELOPMENT.md
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src DEVELOPMENT.md
            git commit -m "Format GEDCOM and ZIP import improvements"
            git push origin HEAD:master
          fi

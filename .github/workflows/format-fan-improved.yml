name: Format fan improved labels and popup
on:
  push:
    paths:
      - .github/workflows/format-fan-improved.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/chart/ancestor_fan.tsx src/chart/ancestor_fan_labels.ts src/chart/ancestor_fan_labels.spec.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src
            git commit -m "Format fan labels and popup implementation"
            git push origin HEAD:master
          fi

name: Format sidebar improvements
on:
  push:
    paths:
      - .github/workflows/format-sidebar-update.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/chart/chart_types.ts src/chart/chart_wrapper.ts src/pages/view_page.tsx src/sidepanel/side-panel.tsx
      - name: Commit formatted changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src
            git commit -m "Format resizable sidebar and selected person highlight"
            git push origin HEAD:master
          fi

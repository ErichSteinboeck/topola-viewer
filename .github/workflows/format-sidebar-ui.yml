name: Format sidebar and menu adjustments
on:
  push:
    paths:
      - .github/workflows/format-sidebar-ui.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/menu/top_bar.tsx src/sidepanel/config/config.tsx src/sidepanel/config/gedcom-import-warning.tsx src/sidepanel/side-panel.tsx src/util/url_args.spec.ts src/translations/de.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src
            git commit -m "Format menu and sidebar settings updates"
            git push origin HEAD:master
          fi

name: Format ancestor fan
on:
  push:
    paths:
      - .github/workflows/format-ancestor-fan.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/chart/ancestor_fan_data.ts src/chart/ancestor_fan_data.spec.ts src/chart/ancestor_fan.tsx src/chart/chart_types.ts src/pages/view_page.tsx src/menu/top_bar.tsx src/util/url_args.ts src/util/url_args.spec.ts src/chart/chart_export.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src
            git commit -m "Format ancestor fan chart implementation"
            git push origin HEAD:master
          fi

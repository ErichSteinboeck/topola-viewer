name: One-time publish revised Mathilde Huber GEDCOM
on:
  push:
    paths:
      - '.github/workflows/publish-wienfluss-huber-once.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and publish privacy-reviewed GEDCOM
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          content = gzip.decompress(base64.b64decode(''.join([
              ""
              ""
              ""
              ""
              ""
          ])))
          assert hashlib.sha256(content).hexdigest() == '997f2e74777ef81fe8b57fbb2d0f518e8b2b2bc5864934a6e0a789254d8768d1', 'Payload checksum mismatch'
          assert content.count(b' INDI\n') == 10
          assert content.count(b' FAM\n') == 3
          assert b'wundrunde' not in content and b'1 OBJE' not in content
          assert b'1 NAME Mathilde /Huber/\n2 GIVN Mathilde\n2 SURN Huber\n1 SEX F' in content
          Path('public/examples/wienfluss-huber.ged').write_bytes(content)
          PY
      - name: Commit GEDCOM update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/examples/wienfluss-huber.ged
          if ! git diff --cached --quiet; then
            git commit -m "Publish expanded privacy-reviewed Mathilde Huber GEDCOM (10 people)"
            git push
          fi
